<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — LinkVault</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card card">
      <div class="brand" style="margin-bottom: 24px;"><span class="brand-mark"></span> LinkVault</div>
      <h1>Welcome back</h1>
      <p class="auth-sub">Log in to see how your links are performing.</p>

      <div id="banner" class="banner banner-error"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" required placeholder="you@example.com" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Log in</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="/register.html">Create one</a></p>
      <p class="auth-switch" style="margin-top:8px; font-size:12px;">Demo login: <span class="mono">demo@demo.com</span> / <span class="mono">demo1234</span></p>
    </div>
  </div>

  <script src="/js/shared.js"></script>
  <script>
    if (Auth.getToken()) window.location.href = "/dashboard.html";

    const form = document.getElementById("loginForm");
    const banner = document.getElementById("banner");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      banner.classList.remove("show");
      submitBtn.disabled = true;
      submitBtn.textContent = "Logging in…";

      try {
        const { token, user } = await api("/auth/login", {
          method: "POST",
          body: {
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
          },
        });
        Auth.save(token, user);
        window.location.href = "/dashboard.html";
      } catch (err) {
        showBanner(banner, err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = "Log in";
      }
    });
  </script>
</body>
</html>
