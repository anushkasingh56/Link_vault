<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Link analytics — LinkVault</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a href="/dashboard.html" class="brand" style="text-decoration:none;"><span class="brand-mark"></span> LinkVault</a>
      <div class="user-chip">
        <button class="btn btn-ghost btn-sm" id="logoutBtn">Log out</button>
      </div>
    </header>

    <div style="padding-top: 24px;">
      <a href="/dashboard.html" class="back-link">← Back to dashboard</a>

      <div class="app-header" style="padding-top:0;">
        <div>
          <h1 id="linkTitle">Loading…</h1>
          <div class="sub mono" id="linkMeta"></div>
        </div>
        <button class="btn btn-ghost" id="copyBtn">⧉ Copy short link</button>
      </div>

      <div class="stat-row">
        <div class="stat panel">
          <div class="label">Total clicks</div>
          <div class="value" id="statTotal">–</div>
        </div>
        <div class="stat panel">
          <div class="label">Last 14 days</div>
          <div class="value" id="statFortnight">–</div>
        </div>
        <div class="stat panel">
          <div class="label">Created</div>
          <div class="value" id="statCreated" style="font-size:16px;">–</div>
        </div>
      </div>

      <div class="chart-card panel">
        <h2>Clicks — last 14 days</h2>
        <svg id="dailyChart" viewBox="0 0 700 220" preserveAspectRatio="none"></svg>
      </div>

      <div class="breakdown-grid">
        <div class="chart-card panel">
          <h2>By device</h2>
          <div id="deviceBreakdown"></div>
        </div>
        <div class="chart-card panel">
          <h2>By referrer</h2>
          <div id="referrerBreakdown"></div>
        </div>
      </div>

      <div class="panel" style="padding: 24px; margin-bottom: 40px;">
        <h2 style="font-size:14px; color: var(--text-mid); font-weight:500; text-transform: uppercase; letter-spacing:0.04em; margin-bottom:16px;">Recent clicks</h2>
        <table class="clicks-table" id="clicksTable">
          <thead>
            <tr><th>When</th><th>Device</th><th>Referrer</th></tr>
          </thead>
          <tbody id="clicksTableBody"></tbody>
        </table>
        <div id="noClicks" class="empty-state hidden">
          <div class="glyph">◌</div>
          <h3>No clicks yet</h3>
          <p>Share your short link and clicks will appear here in real time.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/shared.js"></script>
  <script src="/js/analytics.js"></script>
</body>
</html>
